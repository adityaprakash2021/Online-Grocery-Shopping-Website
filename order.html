<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('https://img.freepik.com/free-vector/hand-drawn-pattern-background_23-2150905251.jpg?ga=GA1.1.986344448.1744132827&semt=ais_hybrid&w=740');
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 0;
            color: white;
        }
        header {
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 1rem;
            text-align: center;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.2);
        }
        form {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.0);
        }
        label {
            display: inline-block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="checkbox"] {
            margin-right: 10px;
        }
        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .product-item {
            background-color: rgba(121, 98, 167, 0.6);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.0);
            text-align: center;
        }
        .product-item h4 {
            margin: 10px 0;
            font-weight: bold; /* Make product names bold */
            color: black; /* Set text color to black */
        }
        .total {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 20px;
            padding: 10px;
            background-color:#333;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        .order-again {
            background-color: #f44336;
        }
        .order-again:hover {
            background-color: #e53935;
        }
        .product-item p {
        font-weight: bold;
        color: black;
        }
        h5 {
            font-weight: bold;
            color: black;
            display: inline-block; /* Keep it on the same line */
            margin-bottom: 10px;
            font-size: 24px; 
        }

    </style>
    <script>
        const items = {{ items | tojson }};
        
        function updateTotal() {
            let total = 0;
            const selectedItems = document.querySelectorAll('input[name="items"]:checked');
            selectedItems.forEach(item => {
                total += items[item.value];
            });
            document.getElementById('total').innerText = `Total: $${total.toFixed(2)}`;
        }
        
        function resetOrder() {
            const selectedItems = document.querySelectorAll('input[name="items"]:checked');
            selectedItems.forEach(item => {
                item.checked = false;
            });
            document.getElementById('total').innerText = `Total: $0.00`;
        }
    </script>
</head>
<body>
    <header>
        <h1>Hello, {{ name }}!</h1>
        <p>Shipping to: {{ address }}</p>
    </header>

    <div class="container">
        <form action="{{ url_for('submit_order') }}" method="POST">
            <input type="hidden" name="name" value="{{ name }}">
            <input type="hidden" name="address" value="{{ address }}">

            <h5>Select items to add to your cart:</h5>

            <div class="product-list">
                {% for item, price in items.items() %}
                    <div class="product-item">
                        <input type="checkbox" name="items" value="{{ item }}" onclick="updateTotal()">
                        <h4>{{ item }}</h4>
                        <p>${{ "%.2f" | format(price) }}</p>
                    </div>
                {% endfor %}
            </div>

            <div class="total" id="total">Total: $0.00</div>

            <button type="submit">Place Order</button>
        </form>

        <div class="order-again">
            <button onclick="resetOrder()">Order Again</button>
        </div>
    </div>
</body>
</html>
